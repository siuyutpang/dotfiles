onboarding = false

[keys]
prefix = "ctrl+s"
previous_tab = ["prefix+p", "prefix+comma"]
next_tab = ["prefix+n", "prefix+period"]
last_pane = "prefix+slash"

[theme]
name = "terminal"

[ui]
sidebar_collapsed_mode = "hidden"
pane_scrollbars = false
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
