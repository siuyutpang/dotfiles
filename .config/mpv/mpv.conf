no-border
fullscreen=no
screenshot-template="%F - [%p] (%#01n)"
screenshot-directory="~/Pictures/screenshots"
speed=1.0
save-position-on-quit
sub-font="Maple Mono"
sub-file-paths=sub
script-opts=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
ytdl-format=bestvideo[height<=?1080][ext=mp4]+bestaudio[ext=m4a]/best
