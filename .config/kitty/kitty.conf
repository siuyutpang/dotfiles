# Minimal kitty configuration. Full defaults: https://sw.kovidgoyal.net/kitty/conf/

# Fonts
font_family      monospace
bold_font        monospace
italic_font      monospace
bold_italic_font monospace
font_size 18

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Scrolling / mouse
mouse_hide_wait -1
click_interval 0.2
pointer_shape_when_dragging beam

# Behavior
enable_audio_bell no
enabled_layouts tall,stack
placement_strategy top-left
confirm_os_window_close 2
background_opacity 0.90
dim_opacity 0.75
update_check_interval 24
shell_integration no-title
copy_on_select yes
strip_trailing_spaces smart
force_ltr yes
close_on_child_death yes

# URL
url_style single

# Tab bar
tab_bar_style separator
tab_powerline_style round
tab_activity_symbol ⏳
tab_title_template "{index}: {title.split('/')[-1]}"

# Mouse
mouse_map left click ungrabbed no-op
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
mouse_map shift+left click grabbed,ungrabbed mouse_click_url_or_select
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_click_url
mouse_map shift+left press ungrabbed,grabbed mouse_selection normal
mouse_map right press grabbed,ungrabbed clear_selection
mouse_map right click grabbed,ungrabbed paste_from_selection

# Keyboard shortcuts
map shift+enter send_text all \e\r
map shift+cmd+w close_os_window
map kitty_mod+c copy_selection_or_last_command_output
map kitty_mod+up scroll_line_up
map kitty_mod+down scroll_line_down
map kitty_mod+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_os_window_with_cwd
map kitty_mod+s launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused
map kitty_mod+p>shift+f kitten hints --type path --program 'launch --type=overlay --cwd=current $EDITOR --'
map kitty_mod+p>u kitten hints --program - --type url
map kitty_mod+p>shift+u kitten hints --program @ --type url
map kitty_mod+p>shift+l kitten hints --type line --program @
map kitty_mod+p>shift+w kitten hints --type word --program @

# Theme
include themes/dracula.conf
