[mgr]
sort_by="natural"
show_hidden = true
linemode = "size"

[preview]
tab_size   = 2
max_width  = 1000
max_height = 1000
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = 'nvim "%s"', block = true },
]
play = [
	{ run = 'mpv --wid=$(xdotool getactivewindow) -- "%s"', orphan = true, for = "unix" },
]
play-audio = [
	{ run = 'kitty mpv -- "%s"', orphan = true, for = "unix" },
]
open = [
	{ run = 'xdg-open "%s"', desc = "Open" },
]

[open]
rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "audio/*", use = "play-audio" },
	{ mime = "video/*", use = "play" },
	{ mime = "image/*", use = "open" },
	{ mime = "application/*", use = "open" },
]
